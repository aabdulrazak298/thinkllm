[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thinkllm"
version = "0.1.0"
description = "LLM debate system — agents debate strategy before answering"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=0.0.50",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
thinkllm = "thinkllm.cli:main"
