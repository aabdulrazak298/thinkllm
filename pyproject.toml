[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thinkllm"
version = "0.1.0"
description = "LLM debate system — agents debate strategy before answering"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
thinkllm = "thinkllm.cli:main"
